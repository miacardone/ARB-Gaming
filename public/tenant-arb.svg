<!--
  App icon — favicon, and the letterhead mark on generated dispute documents.

  Rebuilt to match ARB's own webclip rather than invented: the three "arb"
  glyphs lifted unchanged out of the client's lockup, white on a flat violet
  rounded square, sized to ~58% of the tile width the way theirs is.

  The glyphs are picked by measured bounding box, not by position in the file —
  the corrected export appends the re-outlined a and b after every other path,
  so they are elements 18 and 19 while the r is element 0. Selecting the first
  three elements gets you the r and two letters of "interactive".

  Violet is #5C1BF9, sampled from ARB's published Webclip.png. brand.config's
  `primary` is the same value, so the tile cannot disagree with the UI.
-->
