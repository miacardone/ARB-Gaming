<!--
  ARB Interactive lockup, supplied by the client as "ARB Gaming Logo.svg".

  Two things were changed on intake and nothing else:
    1. The export painted a white background rect UNDER white artwork, so the
       file rendered as a blank white box on any light surface. The rect is
       gone; the artwork is untouched.
    2. width/height are dropped in favour of the viewBox, and the viewBox is
       trimmed to the artwork's own bounds plus even padding. The export's
       canvas carried 46 units of dead space on the left and 16 on the right,
       which is an export artefact rather than clear-space — left in, the rail
       lockup floats off its own left edge. No path data is touched; only the
       canvas. brand.config carries the resulting 229:35 ratio.

  This is the white-on-transparent variant: it is only correct on a dark
  surface, which is the only place Wordmark renders it (inverse).
-->
