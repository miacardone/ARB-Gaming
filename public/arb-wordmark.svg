  one. (The first export was missing the 'a' and the 'b': only the 'r' of "arb"
  had been outlined, so it rendered as a lone bracket followed by a 40.5-unit
  hole where the other two letters should have been, against 1.1-4.8 units of
  normal letterspacing.)

  Nothing in the artwork is touched. The only change is the viewBox: the export
  canvas is 331x80 while the artwork occupies x 34.8-290.1, y 17.0-51.2, and
  that off-center padding makes the rail lockup float off its own left edge.
  Trimmed to the artwork's bounds plus 4 units. brand.config carries the
  resulting 263.3:42.2 ratio.

  White-on-transparent: correct only on a dark surface, which is the only place
  Wordmark renders it (inverse).
-->
